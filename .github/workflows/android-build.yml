name: Build & Publish Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*", "beta*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Assemble & Release IngeTrazo Mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (with full history & Git LFS)
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK (API 36.1)
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install Build Tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore or Generate Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Ensure .env exists for Secrets Gradle Plugin
        run: |
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest

      - name: Assemble Debug APK
        run: gradle :app:assembleDebug

      - name: Prepare APK & Generate Release Changelog
        id: prep_release
        run: |
          APK_OUT="app/build/outputs/apk/debug/IngeTrazo-Mobile-beta-0.1.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_OUT"

          # Determine tag name (use pushed tag if available, otherwise beta-0.1)
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="beta-0.1"
          fi
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

          APK_SHA256=$(sha256sum "$APK_OUT" | awk '{print $1}')
          APK_SIZE=$(du -h "$APK_OUT" | awk '{print $1}')
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")

          {
            echo "## IngeTrazo Mobile (\`beta 0.1\`) — Automated APK Release"
            echo ""
            echo "- **Version**: \`beta 0.1\` (\`versionCode 1\`)"
            echo "- **Build Number**: \`#${GITHUB_RUN_NUMBER}\` (${BUILD_DATE})"
            echo "- **Commit**: \`${GITHUB_SHA::7}\`"
            echo "- **APK File**: \`IngeTrazo-Mobile-beta-0.1.apk\` (${APK_SIZE})"
            echo "- **SHA-256**: \`${APK_SHA256}\`"
            echo "- **Creator**: [Brillian11](https://github.com/Brillian11)"
            echo "- **Special Thanks**: [IngeTrazo Project](https://github.com/ingelibre/ingetrazo)"
            echo ""
            if [ -f "CHANGELOG.md" ]; then
              cat CHANGELOG.md
              echo ""
            fi
            echo "### Recent Commits"
            git log -n 15 --pretty=format:"- %s (\`%h\` by %an)" || true
            echo ""
          } > RELEASE_NOTES.md

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IngeTrazo-Mobile-beta-0.1-APK
          path: app/build/outputs/apk/debug/IngeTrazo-Mobile-beta-0.1.apk
          if-no-files-found: error

      - name: Publish APK & Changelog to GitHub Releases Page
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep_release.outputs.tag_name }}
          name: "IngeTrazo Mobile beta 0.1 (Build #${{ github.run_number }})"
          body_path: RELEASE_NOTES.md
          prerelease: true
          make_latest: true
          files: app/build/outputs/apk/debug/IngeTrazo-Mobile-beta-0.1.apk
