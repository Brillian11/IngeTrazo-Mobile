name: Build & Publish Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*", "beta*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-apk:
    name: Assemble & Release IngeTrazo Mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses & Configure SDK
        run: |
          set +o pipefail
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="${ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"

          mkdir -p "${ANDROID_HOME}/licenses"
          cat << 'EOF' > "${ANDROID_HOME}/licenses/android-sdk-license"
          8933bad161af4178b1185d1a37fbf41ea5269c55
          d56f5187479451eabf01fb78af6dfcb131a6481e
          24333f8a63b6825ea9c5514f83c2829b004d1fee
          859f317696f67ef3d7f30a50a5560e7834b43903
          EOF
          cat << 'EOF' > "${ANDROID_HOME}/licenses/android-sdk-preview-license"
          84831b9409646a918e30573bab4c9c91346d8abd
          504667f4c0de7af1a06de9f4b1727b84351f2910
          EOF

          SDKMANAGER=$(command -v sdkmanager || echo "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager")
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --sdk_root="${ANDROID_HOME}" --licenses > /dev/null 2>&1 || true
            yes | "$SDKMANAGER" --sdk_root="${ANDROID_HOME}" "platform-tools" "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0" > /dev/null 2>&1 || true
          fi

      - name: Restore or Generate Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore || rm -f debug.keystore
          fi
          if [ ! -s "debug.keystore" ]; then
            rm -f debug.keystore
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Ensure .env exists for Secrets Gradle Plugin
        run: |
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Assemble Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK & Generate Release Changelog
        id: prep_release
        run: |
          APK_OUT="app/build/outputs/apk/debug/IngeTrazo-Mobile-beta-0.1.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_OUT"

          # Determine tag name (use pushed tag if available, otherwise beta-0.1)
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="beta-0.1"
          fi
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

          APK_SHA256=$(sha256sum "$APK_OUT" | awk '{print $1}')
          APK_SIZE=$(du -h "$APK_OUT" | awk '{print $1}')
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")

          {
            echo "## IngeTrazo Mobile (\`beta 0.1\`) — Automated APK Release"
            echo ""
            echo "- **Version**: \`beta 0.1\` (\`versionCode 1\`)"
            echo "- **Build Number**: \`#${GITHUB_RUN_NUMBER}\` (${BUILD_DATE})"
            echo "- **Commit**: \`${GITHUB_SHA::7}\`"
            echo "- **APK File**: \`IngeTrazo-Mobile-beta-0.1.apk\` (${APK_SIZE})"
            echo "- **SHA-256**: \`${APK_SHA256}\`"
            echo "- **Creator**: [Brillian11](https://github.com/Brillian11)"
            echo "- **Special Thanks**: [IngeTrazo Project](https://github.com/ingelibre/ingetrazo)"
            echo ""
            if [ -f "CHANGELOG.md" ]; then
              cat CHANGELOG.md
              echo ""
            fi
            echo "### Recent Commits"
            git log -n 15 --pretty=format:"- %s (\`%h\` by %an)" || true
            echo ""
          } > RELEASE_NOTES.md

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IngeTrazo-Mobile-beta-0.1-APK
          path: app/build/outputs/apk/debug/IngeTrazo-Mobile-beta-0.1.apk
          if-no-files-found: error

      - name: Publish APK & Changelog to GitHub Releases Page
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep_release.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: "IngeTrazo Mobile beta 0.1 (Build #${{ github.run_number }})"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          make_latest: 'true'
          files: app/build/outputs/apk/debug/IngeTrazo-Mobile-beta-0.1.apk
